name: Remove Overdrive release

on: push

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete overdrive-latest release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete overdrive-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "release not found"
          gh release list --repo "$GITHUB_REPOSITORY"
